<!DOCTYPE html>
<html lang="en">

    <title>Build a Newspaper Article</title>
</head>
<body>

        <h2 class="headline">WEB-SLINGER STRIKES AGAIN: SPIDER-MAN CAUSES $2M IN PROPERTY DAMAGE DURING MIDTOWN BRAWL!</h2>

        <p class="text"></p>
        <p class="text"></p>
    </main>
</body>
</html>
