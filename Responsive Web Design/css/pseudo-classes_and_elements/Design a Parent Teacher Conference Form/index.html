<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Parent Teacher Conference Form</title>
</head>
<body>
    <main class="container">
      <h1 class="title center">Parent Teacher Conference Form</h1>
      <p class="description center">Please fill out the form below to help schedule your parent-teacher conference.</p>
      <form>
      <fieldset>
        <legend>Student Information</legend>
          <label for="full-name">Full Name:</label>
          <input id="full-name" type="text" name="full-name" placeholder="e.g., Jane Doe">
          <br>
          <label for="grade">Student Grade:</label>
          <input id="grade" type="number" name="grade" placeholder="e.g., 4">
      </fieldset>
      <fieldset>
          <legend>Parent/Guardian Information</legend>
          <label for="guardian">Parent/Guardian Name:</label>
          <input id="guardian" type="text" name="guardian" placeholder="e.g., Nancy Doe">
      </fieldset>
      <fieldset>
          <legend>Preferred Contact Method</legend>
          <label for="email">Email:</label>
          <input id="email" type="radio" name="email" required>
      </fieldset>
      <fieldset>
          <legend>Additional Notes</legend>
          <label for="notes">Any specific concerns or topics you'd like to discuss?</label>
          <br>
          <textarea id="notes" cols="50" rows="10"></textarea>
      </fieldset>
    </form>
    </main>

</body>
</html>
