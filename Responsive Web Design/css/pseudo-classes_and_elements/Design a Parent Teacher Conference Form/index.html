<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Parent Teacher Conference Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
      <h1 class="title center">Parent Teacher Conference Form</h1>
      <p class="description center">Please fill out the form below to help schedule your parent-teacher conference.</p>
      <form>
      <fieldset>
        <legend>Student Information</legend>
          <label for="student-name">Full Name: </label>
          <input id="student-name" type="text" name="student-name" placeholder="E.g., Jane Doe" required>
          <br>
          <label for="grade">Student Grade: </label>
          <input id="grade" type="number" name="grade" placeholder="E.g., 4" required>
      </fieldset>
      <fieldset>
          <legend>Parent/Guardian Information</legend>
          <label for="parent-name">Parent/Guardian Name: </label>
          <input id="parent-name" type="text" name="parent-name" placeholder="E.g., Nancy Doe" required>
      </fieldset>
      <fieldset>
          <legend>Preferred Contact Method</legend>
          <label class="contact-method" for="email">Email: </label>
          <input class="contact-method-radio-btn" id="email" type="radio" name="contact-method" value="email" checked>
          <label class="contact-method" for="phone">Phone: </label>
          <input class="contact-method-radio-btn" id="phone" type="radio" name="contact-method" value="phone">
      </fieldset>
      <fieldset>
          <legend>Additional Notes</legend>
          <label for="notes">Any specific concerns or topics you'd like to discuss?</label>
          <br>
          <textarea id="notes" name="notes" rows="4" cols="50"></textarea>
      </fieldset>
      <button class="submit-btn" type="submit">Submit Form</button>
    </form>
    </main>

</body>
</html>
