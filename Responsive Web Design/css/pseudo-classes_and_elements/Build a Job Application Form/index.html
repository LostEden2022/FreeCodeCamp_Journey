<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <title>Application Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<h1>Job Application Form</h1>
<form>
  <fieldset>
    <label for="full-name">Full Name:</label>
    <input type="text" id="full-name" name= "name" placeholder="e.g. John Doe" required/>
    <br>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name= "email" placeholder="e.g. example@email.com" minlength="20" required/>
    <br>
    <label for="dropdown">Desired Position:</label>
    <select id="dropdown" name="position">
      <option value="">Select One</option>
      <option value="1">User Design</option>
      <option value="2">Platform Engineer</option>
      <option value="3">Software Developer</option>
      <option value="4">Product Manager</option>
    </select>
  </fieldset>
  <fieldset class="radio-group">
    <legend>Availability</legend>
    <input class="checkbox" type="checkbox" id="full-time" name="availability"/>
    <label for="full-time">Full-Time</label>
    <input class="radio-button" type="radio" id="part-time" name="availability"/>
    <label for="part-time">Part-Time</label>
    <input class="radio-button" type="radio" id="intern" name="availability"/>
    <label for="intern">Intern</label>
  </fieldset>
  <label for="message">Why do you want this job?</label>
  <br>
  <textarea id="message" name="why" placeholder="I am here to pursue my passion..." rows="10" cols="50">
      </textarea>
  <br>
  <button type="submit"><a href="#" target="_blank">Submit Application</a></button>
</form>
</div>
</body>
</html>
