<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <title>Application Form</title>
</head>
<body>
<h1>Job Application Form</h1>
<form>
  <fieldset>
    <label for="full-name">Full Name:</label>
    <input type="text" id="full-name" name= "name" placeholder="Enter Your Name" minlength="40" required/>
    <br>
    <label for="e-mail">E-mail:</label>
    <input type="email" id="e-mail" name= "e-mail" placeholder="example@email.com" minlength="40" required/>
    <br>
    <label for="dropdown">Desired Position:</label>
    <select id="dropdown" name="position">
      <option value="">Select One</option>
      <option value="1">User Design</option>
      <option value="2">Platform Engineer</option>
      <option value="3">Software Developer</option>
      <option value="4">Product Manager</option>
    </select>
  </fieldset>
  <fieldset>
    <legend>Availability</legend>
    <input type="radio" id="full-time" name="availability" required/>
    <label for="full-time">Full-Time</label>
    <input type="radio" id="part-time" name="availability" required/>
    <label for="part-time">Part-Time</label>
    <input type="radio" id="intern" name="availability" required/>
    <label for="intern">Intern</label>
  </fieldset>
  <label for="why">Why do you want this job?</label>
  <br>
  <textarea id="why" name="why" placeholder="I am here to pursue my passion..." rows="10" cols="50">
      </textarea>
  <br>
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
