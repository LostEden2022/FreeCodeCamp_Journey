<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Build an Availability Table</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <main>
    <table>
      <caption>Weekly Meeting Availability Schedule</caption>
      <thead>
        <tr>
          <th scope="col">Monday</th>
          <th scope="col">Tuesday</th>
          <th scope="col">Wednesday</th>
          <th scope="col">Thursday</th>
          <th scope="col">Friday</th>
        </tr>
      </thead>
      <tbody>
        <tr class="sharp">
          <th class="time" scope="row">0800</th>
          <td class="available-1" aria-label="availability-1"></td>
          <td class="available-2" aria-label="availability-2"></td>
          <td class="available-3" aria-label="availability-3"></td>
          <td class="available-4" aria-label="availability-4"></td>
          <td class="available-5" aria-label="availability-5"></td>
        </tr>
        <tr class="half">
          <th class="time" scope="row">0830</th>
          <td class="available-5" aria-label="availability-5"></td>
          <td class="available-4" aria-label="availability-4"></td>
          <td class="available-3" aria-label="availability-3"></td>
          <td class="available-2" aria-label="availability-2"></td>
          <td class="available-1" aria-label="availability-1"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">0900</th>
          <td class="available-5" aria-label="availability-5"></td>
          <td class="available-1" aria-label="availability-1"></td>
          <td class="available-2" aria-label="availability-2"></td>
          <td class="available-3" aria-label="availability-3"></td>
          <td class="available-4" aria-label="availability-4"></td>
        </tr>
        <tr class="half">
          <th class="time" scope="row">0930</th>
          <td class="available-4" aria-label="availability-4"></td>
          <td class="available-5" aria-label="availability-5"></td>
          <td class="available-1" aria-label="availability-1"></td>
          <td class="available-2" aria-label="availability-2"></td>
          <td class="available-3" aria-label="availability-3"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="col">1000</th>
          <td class="available-3" aria-label="availability-3"></td>
          <td class="available-4" aria-label="availability-4"></td>
          <td class="available-5" aria-label="availability-5"></td>
          <td class="available-1" aria-label="availability-1"></td>
          <td class="available-2" aria-label="availability-2"></td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
