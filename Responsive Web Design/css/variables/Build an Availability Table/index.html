<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Build an Availability Table</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <main>
    <table>
      <caption>Weekly Meeting Availability Schedule</caption>
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col">Monday</th>
          <th scope="col">Tuesday</th>
          <th scope="col">Wednesday</th>
          <th scope="col">Thursday</th>
          <th scope="col">Friday</th>
        </tr>
      </thead>
      <tbody>
        <tr class="sharp">
          <th class="time" scope="row">0800</th>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="flat">
          <th class="time" scope="row"></th>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-0" aria-label="0 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-1" aria-label="1 available"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">0900</th>
          <td class="available-0" aria-label="0 available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-4" aria-label="4 available"></td>
        </tr>
        <tr class="flat">
          <th class="time" scope="row"></th>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-3" aria-label="3 available"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">1000</th>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
        </tr>
        <tr class="flat">
          <th class="time" scope="row"></th>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-3" aria-label="3 available"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">1100</th>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
        </tr>
        <tr class="sharp">
          <th class="time" scope="row">1200</th>
          <td class="available-3" aria-label="3 available"></td>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
        </tr>
        <tr class="flat">
          <th class="time" scope="row"></th>
          <td class="available-4" aria-label="4 available"></td>
          <td class="available-5" aria-label="5+ available"></td>
          <td class="available-1" aria-label="1 available"></td>
          <td class="available-2" aria-label="2 available"></td>
          <td class="available-3" aria-label="3 available"></td>
        </tr>
      </tbody>
    </table>
    <div id="legend">
      <span>Availability</span>
      <div id="legend-gradient"></div>
    </div>
  </main>
</body>
</html>
