<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design a Feature Selection Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Feature Selection</h1>
    <p class="subtitle">Choose the desired modules to configure your environment.</p>

    <div class="feature-card-container">
        <!-- Networking -->
        <label class="feature-card" for="networking">
            <div>
                <div class="card-header">
                    <h2 class="feature-title">Networking</h2>
                    <input type="checkbox" class="feature-checkbox" id="networking" name="feature" value="networking"/>
                </div>
                <p class="feature-description">Switches, Routers, and structural server configurations.</p>
            </div>
        </label>

        <!-- Cybersecurity -->
        <label class="feature-card" for="cybersecurity">
            <div>
                <div class="card-header">
                    <h2 class="feature-title">Cybersecurity</h2>
                    <input type="checkbox" class="feature-checkbox" id="cybersecurity" name="feature" value="cybersecurity"/>
                </div>
                <p class="feature-description">Penetration Testing, Vulnerability Testing, and defensive controls.</p>
            </div>
        </label>

        <!-- Artificial Intelligence -->
        <label class="feature-card" for="ai">
            <div>
                <div class="card-header">
                    <h2 class="feature-title">Artificial Intelligence</h2>
                    <input type="checkbox" class="feature-checkbox" id="ai" name="feature" value="ai"/>
                </div>
                <p class="feature-description">Machine learning workflows, LLM orchestration, and smart automation.</p>
            </div>
        </label>

        <!-- Software Defined Radio -->
        <label class="feature-card" for="sdr">
            <div>
                <div class="card-header">
                    <h2 class="feature-title">Software Defined Radio</h2>
                    <input type="checkbox" class="feature-checkbox" id="sdr" name="feature" value="sdr"/>
                </div>
                <p class="feature-description">Signal analysis, wireless protocols, and radio frequency interception.</p>
            </div>
        </label>

        <!-- Survival Skills -->
        <label class="feature-card" for="survival">
            <div>
                <div class="card-header">
                    <h2 class="feature-title">Survival Skills</h2>
                    <input type="checkbox" class="feature-checkbox" id="survival" name="feature" value="survival"/>
                </div>
                <p class="feature-description">Wilderness readiness, navigation systems, and emergency preparedness.</p>
            </div>
        </label>

        <!-- Expressive Skills -->
        <label class="feature-card" for="expressive">
            <div>
                <div class="card-header">
                    <h2 class="feature-title">Expressive Skills</h2>
                    <input type="checkbox" class="feature-checkbox" id="expressive" name="feature" value="expressive"/>
                </div>
                <p class="feature-description">Public speaking, creative writing, and concise interpersonal delivery.</p>
            </div>
        </label>
    </div>
</div>
</body>
</html>
