<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Design a Feature Selection Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card">
            <span class="feautre-title">Networking</span>
            <input type="checkbox" class="feature-checkboex" name="feature" value="networking"/>
            <span class="feature-description">Switches, Routers, and Servers...</span>
        </label>
        <label class="feature-card"><input type="checkbox"/>Cybersecurity</label>
        <p>Penetration Testing, Vulnerability Testing, Malware Creation...</p>
        <label class="feature-card"><input type="checkbox"/>Artificial Intelligence</label>
        <label class="feature-card"><input type="checkbox"/>Software Defined Radio</label>
        <label class="feature-card"><input type="checkbox"/>Survival Skills</label>
        <label class="feature-card"><input type="checkbox"/>Expressive Skills</label>
    </div>
</body>
</html>
