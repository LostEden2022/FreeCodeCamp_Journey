<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Grey Sparrow LLC</h1>
  <div class="form-container">
  <form>
    <h2>Contact Information:</h2>
    <fieldset>
      <label for="full-name">Enter your Full Name: <input type="text" id="full-name" name="full-name" placeholder="e.g. Jane Doe" required/></label>
    </fieldset>
    <fieldset>
      <label for="email">Enter your E-mail: <input type="email" id="email" name="email" placeholder="e.g. jane.doe@email.com" required/></label>
      <label for="phone">Enter your Phone Number: <input type="number" id="phone" name="phone" placeholder="xxx-xxxx-xxx" required/></label>
    </fieldset>
    <fieldset>
      <label for="referral">Where did your us from?
      <select id="referral">
        <option value=""></option>
        <option value="1">Never</option>
        <option value="2">Social Media</option>
        <option value="3">Others</option>
      </select>
      </label>
    </fieldset>
    <fieldset>
      <label for="message">Message
      <textarea id="message" name="message" rows="3" cols="50" required></textarea>
      </label>
    </fieldset>
    <button type="submit" name="submit">Submit</button>
  </form>
  </div>
</body>
</html>
