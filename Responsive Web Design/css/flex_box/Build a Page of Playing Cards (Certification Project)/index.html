<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Design a Page of Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="flush-header">
    <a href="#" target="_blank">The Royal Flush</a>
    <a href="#" target="_blank">The Straight Flush</a>
  </nav>
  <main id="playing-cards">
    <h1 class="hand">The Royal Flush</h1>
    <p class="definition">Definition: A Royal Flush is the highest possible poker hand, made up of A-K-Q-J-10 of the same suit.</p>
      <div class="card">
        <div class="left">
          <span class="rank">10</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">♥♥♥♥♥♥♥♥♥♥</div>
        <div class="right">♥ 10</div>
      </div>
      <div class="card">
        <div class="left">
          <span class="rank">J</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">
          <img src="" alt="jack-playing-cards">
        </div>
        <div class="right">♥ J</div>
      </div>
      <div class="card">
        <div class="left">
          <span class="rank">Q</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">♥♥♥♥♥♥♥♥♥♥</div>
        <div class="right">♥ Q</div>
      </div>
      <div class="card">
        <div class="left">
          <span class="rank">K</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">♥♥♥♥♥♥♥♥♥♥</div>
        <div class="right">♥ K</div>
      </div>
      <div class="card">
        <div class="left">
          <span class="rank">A</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">♥</div>
        <div class="right">♥ A</div>
      </div>
  </main>
</body>
</html>
