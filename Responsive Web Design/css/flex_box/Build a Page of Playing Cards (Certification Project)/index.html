<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Design a Page of Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="flush-header">
    <a href="#" target="_blank">The Royal Flush</a>
    <a href="#" target="_blank">The Straight Flush</a>
  </nav>
  <main id="playing-cards">
    <h1 class="hand">The Royal Flush</h1>
    <p class="definition">Definition: A Royal Flush is the highest possible poker hand, made up of A-K-Q-J-10 of the same suit.</p>
      <div class="card heart">
        <div class="left">
          <span class="rank">10</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle ten-card">
          <div class="pip-column">
            <span class="pip">♥</span>
            <span class="pip upside-down">♥</span>
            <span class="pip">♥</span>
            <span class="pip upside-down">♥</span>
            <span class="pip">♥</span>
          </div>
          <div class="pip-column">
            <span class="pip upside-down">♥</span>
            <span class="pip">♥</span>
            <span class="pip upside-down">♥</span>
            <span class="pip">♥</span>
            <span class="pip upside-down">♥</span>
          </div>
        </div>
        <div class="right">
          <span>10</span>
          <span>♥</span>
        </div>
      </div>
      <div class="card heart">
        <div class="left">
          <span class="rank">J</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">
          <img src="" alt="jack-playing-cards">
        </div>
        <div class="right">
          <span>J</span>
          <span>♥</span>
        </div>
      </div>
      <div class="card heart">
        <div class="left">
          <span class="rank">Q</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">
          <img src="" alt="jack-playing-cards"/>
        </div>
        <div class="right">
          <span>♥</span>
          <span>Q</span>
        </div>
      </div>
      <div class="card heart">
        <div class="left">
          <span class="rank">K</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle">
          <img src="" alt="jack-playing-cards"/>
        </div>
        <div class="right">
          <span>K</span>
          <span>♥</span>
        </div>
      </div>
      <div class="card heart">
        <div class="left">
          <span class="rank">A</span>
          <span class="suit">♥</span>
        </div>
        <div class="middle ace-card">
          <span>♥</span>
        </div>
        <div class="right">
          <span>A</span>
          <span>♥</span>
        </div>
      </div>
  </main>
</body>
</html>
