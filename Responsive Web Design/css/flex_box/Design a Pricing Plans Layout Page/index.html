<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Design a Pricing Plans Layout Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Pricing Plans</h1>
  <div class="pricing-container">
    <div class="pricing-card basic-plan">
      <h2>Basic</h2>
      <p class="price">$9/month</p>
      <p class="features">
        ✓ Access to our core features <br>
        ✓ Email support <br>
        ✗ Advanced analytics <br>
        ✗ Custom integrations <br>
        ✗ Priority support <br>
      </p>
      <button type="submit" name="submit">Choose Plan</button>
    </div>
    <div class="pricing-card pro-plan">
      <h2>Pro</h2>
      <p>$19/month</p>
    </div>
    <div class="pricing-card premium-plan">
      <h2>Premium</h2>
      <p>$29/month</p>
    </div>
  </div>
</body>
</html>
