<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>Build an Event Flyer Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/event.jpg" alt="hanging colorful banners">
    <h1>Kathmandu Festival</h1>
  </header>
  <main>
    <section>
        <h2>Join us for the first annual Kathmandu Festival!</h2>
        <p>When: October 3rd </p>
        <p>Where: Boulder Park </p>
    </section>
      <hr>
    <section class="box">
        <h2 class="details">Festival Highlights</h2>
    </section>
    <section class="box">
        <h2 class="details">Special Guests</h2>
    </section>
    <section class="box">
        <h2 class="details">Food Trucks</h2>
    </section>
  </main>
</body>
</html>
